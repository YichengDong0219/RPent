hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0-0

runner:
  task_type: sft
  logger:
    log_path: /home/dongyicheng/rpent/logs/distillation/sft
    project_name: harness-vla-sft
    experiment_name: libero_harness_pi05_sft
    wandb_entity: ethan-dong-nanjing-university-org
    logger_backends: [wandb, tensorboard]
  max_epochs: -1
  max_steps: 200
  val_check_interval: -1
  save_interval: 200

data:
  train_data_paths: /path/to/harness-lerobot-dataset
  num_workers: 2

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 2
  global_batch_size: 16
  seed: 42
  model:
    model_type: openpi
    model_path: /home/dongyicheng/checkpoints/RLinf-Pi05-LIBERO-130-fullshot-SFT
    precision: null
    num_action_chunks: 5
    action_dim: 7
    is_lora: false
    lora_rank: 32
    use_proprio: true
    num_steps: 5
    add_value_head: false
    openpi:
      config_name: pi05_libero
      num_images_in_input: 2
      noise_level: 0.5
      action_chunk: 5
      num_steps: 5
      train_expert_only: true
      action_env_dim: 7
      noise_method: flow_sde
      add_value_head: false
      value_after_vlm: false
      value_vlm_mode: mean_token
      detach_critic_input: false
    openpi_data:
      norm_stats_path: /home/dongyicheng/checkpoints/RLinf-Pi05-LIBERO-130-fullshot-SFT/physical-intelligence/libero/norm_stats.json
  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    lr_scheduler: openpi_cosine
    lr_warmup_steps: 20
    total_training_steps: 200
    num_cycles: 0.5
    min_lr: 2.5e-6
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    cpu_offload: false
    reshard_after_forward: true
    enable_gradient_accumulation: true
    forward_prefetch: false
    limit_all_gathers: false
    backward_prefetch: null
    use_orig_params: true
    use_liger_kernel: false
    gradient_checkpointing: false
    save_full_model_weights: true
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: bf16
    amp_autocast:
      enabled: false
      precision: bf16
    grad_scaler:
      enabled: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
